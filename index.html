. I love supporting people and teams, and bringing ideas to life.&nbsp;<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; padding-top: 6px\">\n<a href=\"#projects\" style=\"text-decoration: none; padding: 13px 25px; background: #FFD6E8; color: #2A1033; border: 3px solid #F56B9C; border-radius: 999px; font-weight: 700; font-size: 17px\">see the projects<\u002Fa>\n<a href=\"#contact\" style=\"text-decoration: none; padding: 13px 25px; background: #FFFFFF; color: #2A1033; border: 3px solid #2EC4C0; border-radius: 999px; font-weight: 700; font-size: 17px\">say hi<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 1440 80\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display: block; width: 100%; height: 64px\"><path d=\"M0 30 C84.8 18.2 254.4 19.6 254.4 19.6 C254.4 19.6 324.8 25.1 360 30 C480 46.7 600 46.7 720 30 C840 13.3 960 13.3 1080 30 C1200 46.7 1320 46.7 1440 30 L1440 80 L0 80 Z\" fill=\"#F56B9C\"><\u002Fpath><path d=\"M0 50 Q180 25 360 50 T720 50 T1080 50 T1440 50 V80 H0z\" fill=\"#FFD6E8\"><\u002Fpath><\u002Fsvg>\n<\u002Fheader>\n\n<main>\n<!-- NAME MEANING on blush -->\n<section aria-label=\"What jamjar means\" style=\"background: #FFD6E8\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 8px 24px 36px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center\">\n<p style=\"margin: 0; background: #FFFFFF; border: 2px solid #F56B9C; border-radius: 999px; padding: 10px 20px; font-size: 18px\"><span class=\"fr\" style=\"font-size: 22px\">jam<\u002Fspan> = joy &amp; movement<\u002Fp>\n<p style=\"margin: 0; background: #FFFFFF; border: 2px solid #F56B9C; border-radius: 999px; padding: 10px 20px; font-size: 18px\"><span class=\"fr\" style=\"font-size: 22px\">jar<\u002Fspan> = j &amp; r, my family<\u002Fp>\n<p style=\"margin: 0; font-weight: 600; font-size: 18px; padding-left: 6px\">Together: the stuff I make for real life.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PROJECTS: one card style, fills rotate blush / butter / teal, straight -->\n<section id=\"projects\" style=\"max-width: 1160px; margin: 0 auto; padding: 72px 24px 96px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px; margin-bottom: 40px\">\n<h2 style=\"margin: 0; font-size: clamp(40px, 5vw, 64px); line-height: 1\">projects<\u002Fh2>\n<p class=\"it\" style=\"margin: 0; font-size: 22px\">creating, sharing, and figuring things out for real life.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px 28px\">\n\n<article style=\"background: #FFD6E8; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<p style=\"margin: 0; align-self: flex-start; background: #FFFFFF; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase\">barre · training<\u002Fp>\n<h3 style=\"margin: 0; font-size: 40px; line-height: 1\">jam method<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.55; flex-grow: 1\">Barre classes and teacher training built on functional strength, longevity, joy on the beat, community, and knowing the why.<\u002Fp>\n<a href=\"https://sweatbarretraining.netlify.app/\" style=\"align-self: flex-start; text-decoration: none; padding: 12px 22px; background: #FFFFFF; color: #2A1033; border: 2px solid #F56B9C; border-radius: 999px; font-weight: 700\">train with me<\u002Fa>\n<\u002Farticle>\n\n<article style=\"background: #FFE680; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<p style=\"margin: 0; align-self: flex-start; background: #FFFFFF; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase\">food · instagram<\u002Fp>\n<h3 style=\"margin: 0; font-size: 40px; line-height: 1\">thetreatlife<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.55; flex-grow: 1\">Find me on Instagram @thetreatlife, sharing recipes and anything else delicious and inspiring.<\u002Fp>\n<a href=\"https://www.instagram.com/thetreatlife/\" style=\"align-self: flex-start; text-decoration: none; padding: 12px 22px; background: #FFFFFF; color: #2A1033; border: 2px solid #F56B9C; border-radius: 999px; font-weight: 700\">follow along<\u002Fa>\n<\u002Farticle>\n\n<article style=\"background: #B9ECE9; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<p style=\"margin: 0; align-self: flex-start; background: #FFFFFF; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase\">writing · linkedin<\u002Fp>\n<h3 style=\"margin: 0; font-size: 40px; line-height: 1\">adhd life<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.55; flex-grow: 1\">Honest writing on ADHD and work, from a PM who reheats the same coffee three times.<\u002Fp>\n<a href=\"https://www.linkedin.com/in/pavlikkeddy/\" style=\"align-self: flex-start; text-decoration: none; padding: 12px 22px; background: #FFFFFF; color: #2A1033; border: 2px solid #F56B9C; border-radius: 999px; font-weight: 700\">read on linkedin<\u002Fa>\n<\u002Farticle>\n\n<article style=\"background: #FFE680; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<p style=\"margin: 0; align-self: flex-start; background: #FFFFFF; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase\">community · app<\u002Fp>\n<h3 style=\"margin: 0; font-size: 40px; line-height: 1\">giveitaway<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.55; flex-grow: 1\">Free kids' clothes and gear, swapped between neighbours. Outgrown stuff finds its next kid.<\u002Fp>\n<a href=\"https://giveitawayapp.com\" style=\"align-self: flex-start; text-decoration: none; padding: 12px 22px; background: #FFFFFF; color: #2A1033; border: 2px solid #F56B9C; border-radius: 999px; font-weight: 700\">give or get<\u002Fa>\n<\u002Farticle>\n\n<article style=\"background: #B9ECE9; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<p style=\"margin: 0; align-self: flex-start; background: #FFFFFF; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase\">kids · app<\u002Fp>\n<h3 style=\"margin: 0; font-size: 40px; line-height: 1\">pathwords<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.55; flex-grow: 1\">A word game for ages 4+ that helps kids learn spelling and words!<\u002Fp>\n<a href=\"https://pathwords.netlify.app/\" style=\"align-self: flex-start; text-decoration: none; padding: 12px 22px; background: #FFFFFF; color: #2A1033; border: 2px solid #F56B9C; border-radius: 999px; font-weight: 700\">play<\u002Fa>\n<\u002Farticle>\n\n<article style=\"background: #FFD6E8; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<p style=\"margin: 0; align-self: flex-start; background: #FFFFFF; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase\">kids · app<\u002Fp>\n<h3 style=\"margin: 0; font-size: 40px; line-height: 1\">readcards<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.55; flex-grow: 1\">A flashcard word game for ages 4+ that helps kids learn spelling and words!<\u002Fp>\n<a href=\"https://pathwords.netlify.app/readcards\" style=\"align-self: flex-start; text-decoration: none; padding: 12px 22px; background: #FFFFFF; color: #2A1033; border: 2px solid #F56B9C; border-radius: 999px; font-weight: 700\">play<\u002Fa>\n<\u002Farticle>\n\n<article style=\"grid-column: 1 / -1; color: #2A1033; border-radius: 28px; padding: 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px; background-color: #FA6BA4\">\n<div style=\"flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; align-self: flex-start; background: #E7FF73; color: #2A1033; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase\">ai · learning<\u002Fp>\n<h3 style=\"margin: 0; font-size: 40px; line-height: 1\">claude skills<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.55\">My repo of Claude skills to get the most out of your Claude usage.<\u002Fp>\n<\u002Fdiv>\n<a href=\"https://github.com/kedarinapavlikova/claude-skills\" style=\"text-decoration: none; padding: 14px 24px; background: #E7FF73; color: #2A1033; border-radius: 999px; font-weight: 700\">get the skills<\u002Fa>\n<\u002Farticle>\n\n<\u002Fdiv>\n\n<!-- FEATURED WRITING: LinkedIn quote card -->\n<article id=\"writing\" aria-labelledby=\"writing-h\" style=\"margin-top: 56px; background: #FFFFFF; border: 3px solid #2EC4C0; border-radius: 28px; padding: clamp(28px, 4vw, 48px); display: flex; flex-direction: column; gap: 18px\">\n<p style=\"margin: 0; align-self: flex-start; background: #B9ECE9; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase\">from my writing · linkedin<\u002Fp>\n<h3 id=\"writing-h\" style=\"margin: 0; font-size: clamp(28px, 3.5vw, 40px); line-height: 1.05\">what focus looks like with adhd<\u002Fh3>\n<blockquote cite=\"https://www.linkedin.com/posts/pavlikkeddy_i-have-adhd-and-this-is-what-focus-looks-share-7521320733227065344-Xi15/\" style=\"margin: 0; padding: 4px 0 4px 22px; border-left: 6px solid #F56B9C\">\n<p class=\"it\" style=\"margin: 0 0 12px; font-size: clamp(22px, 2.6vw, 30px); line-height: 1.3\">“I have ADHD, and this is what focus looks like to me.”<\u002Fp>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; max-width: 760px\">During an 80-minute all-hands, I made pizza cheese bun dough, sourdough cheese crackers, and apple spice muffins, fed my sourdough starter, and did all the dishes. Here's why I'm admitting it.<\u002Fp>\n<\u002Fblockquote>\n<a href=\"https://www.linkedin.com/posts/pavlikkeddy_i-have-adhd-and-this-is-what-focus-looks-share-7521320733227065344-Xi15/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"align-self: flex-start; text-decoration: none; padding: 14px 24px; background: #2EC4C0; color: #2A1033; border-radius: 999px; font-weight: 700\">read the full post<span style=\"position: absolute; left: -9999px\"> on LinkedIn (opens in a new tab)<\u002Fspan><\u002Fa>\n<\u002Farticle>\n<\u002Fsection>\n\n<!-- ABOUT on blush -->\n<section id=\"about\" style=\"background: #FFD6E8\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 88px 24px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n<figure style=\"flex: 1 1 300px; max-width: 400px; margin: 0; display: flex; flex-direction: column; gap: 12px; align-items: center\">\n<img src=\"efbbb882-0255-4633-9e03-0980d3db56cf\" alt=\"Keddy's school photo: glasses, highlights, big grin, and a sparkly star tank top\" style=\"display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: center 30%; border: 4px solid #F56B9C; border-radius: 40px; transform: rotate(-2deg)\">\n<figcaption class=\"it\" style=\"font-size: 17px; text-align: center\">the inner child behind the <br>energy &amp; ideas<\u002Ffigcaption>\n<\u002Ffigure>\n<div style=\"flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<h2 style=\"margin: 0; font-size: clamp(40px, 5vw, 64px); line-height: 1\">i'm keddy!<\u002Fh2>\n<p class=\"it\" style=\"margin: 0; font-size: 22px\">product manager. fitness instructor. unapologetic exclamation point user!<\u002Fp>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6\">By day, I'm a Senior Product Manager. By night and Saturday mornings, I teach barre and train new instructors. In between, I build apps, test recipes, and write about life with an ADHD brain. I have a lot of ideas, and I use agentic workflows to make it all happen. I want to help YOUR ideas come to life too. I live in Kelowna, BC with my family, who keep me honest and very busy.<\u002Fp>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 10px; font-weight: 600; font-size: 15px\">\n<li style=\"background: #FFFFFF; border: 2px solid #2EC4C0; border-radius: 999px; padding: 7px 16px\">CSPO · CSM · PMI-ACP<\u002Fli>\n<li style=\"background: #FFFFFF; border: 2px solid #2EC4C0; border-radius: 999px; padding: 7px 16px\">Certified Facilitator<\u002Fli>\n<li style=\"background: #FFFFFF; border: 2px solid #2EC4C0; border-radius: 999px; padding: 7px 16px\">Global Scrum Gathering speaker<\u002Fli>\n<li style=\"background: #FFFFFF; border: 2px solid #2EC4C0; border-radius: 999px; padding: 7px 16px\">Product BC speaker<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- WORK WITH ME -->\n<section id=\"work\" style=\"max-width: 1160px; margin: 0 auto; padding: 88px 24px\">\n<h2 style=\"margin: 0 0 32px; font-size: clamp(40px, 5vw, 64px); line-height: 1\">work with me<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px\">\n<div style=\"border: 3px solid #2EC4C0; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<h3 style=\"margin: 0; font-size: 32px; line-height: 1.05\">bring your idea to life<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6; flex-grow: 1\">Got an idea stuck in your head? I'll help you shape it and build it with agentic AI workflows. No coding background needed; I don't have one either.<\u002Fp>\n<a href=\"#contact\" style=\"align-self: flex-start; text-decoration: none; padding: 12px 22px; background: #FFFFFF; color: #2A1033; border: 2px solid #F56B9C; border-radius: 999px; font-weight: 700\">start your idea<\u002Fa>\n<\u002Fdiv>\n<div style=\"border: 3px solid #2EC4C0; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 14px\">\n<h3 style=\"margin: 0; font-size: 32px; line-height: 1.05\">bring the joy to your team<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6; flex-grow: 1\">Talks and workshops on agile delivery, AI-native teams, ADHD at work, and movement for busy humans. Past stages: Global Scrum Gathering and Product BC.<\u002Fp>\n<a href=\"#contact\" style=\"align-self: flex-start; text-decoration: none; padding: 14px 24px; background: #2EC4C0; color: #2A1033; border-radius: 999px; font-weight: 700\">book a talk<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"talks\" style=\"margin-top: 56px; display: flex; flex-direction: column; gap: 10px\">\n<h3 style=\"margin: 0; font-size: clamp(32px, 4vw, 44px); line-height: 1\">watch my talks<\u002Fh3>\n<p class=\"it\" style=\"margin: 0 0 22px; font-size: 22px\">neurodivergent leadership, live on stage.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px\">\n<figure style=\"margin: 0; background: #FFFFFF; border: 3px solid #F56B9C; border-radius: 28px; padding: 16px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; background: #FFD6E8\">\n<iframe src=\"https://www.youtube-nocookie.com/embed/F-mAzq9QH8A\" title=\"Keddy Pavlik on Neurodivergent Leadership in 7 min, Global Scrum Gathering New Orleans 2024\" loading=\"lazy\" allow=\"accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen style=\"position: absolute; inset: 0; width: 100%; height: 100%; border: 0\"><\u002Fiframe>\n<\u002Fdiv>\n<figcaption style=\"display: flex; flex-direction: column; gap: 6px; padding: 0 8px 8px\">\n<span style=\"align-self: flex-start; background: #E7FF73; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase\">global scrum gathering · 2024<\u002Fspan>\n<span class=\"fr\" style=\"font-size: 26px; line-height: 1.1\">neurodivergent leadership in 7 minutes<\u002Fspan>\n<\u002Ffigcaption>\n<\u002Ffigure>\n<figure style=\"margin: 0; background: #FFFFFF; border: 3px solid #F56B9C; border-radius: 28px; padding: 16px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; background: #FFD6E8\">\n<iframe src=\"https://www.youtube-nocookie.com/embed/BeaY0zybEDc\" title=\"Keddy Pavlik Neurodivergent Leadership Talk at Product BC Conference 2024\" loading=\"lazy\" allow=\"accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen style=\"position: absolute; inset: 0; width: 100%; height: 100%; border: 0\"><\u002Fiframe>\n<\u002Fdiv>\n<figcaption style=\"display: flex; flex-direction: column; gap: 6px; padding: 0 8px 8px\">\n<span style=\"align-self: flex-start; background: #E7FF73; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase\">product bc · 2024<\u002Fspan>\n<span class=\"fr\" style=\"font-size: 26px; line-height: 1.1\">neurodivergent leadership<\u002Fspan>\n<\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- CONTACT on blush -->\n<section id=\"contact\" style=\"background: #FFD6E8\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 88px 24px; display: flex; flex-wrap: wrap; gap: 48px\">\n<div style=\"flex: 1 1 320px; display: flex; flex-direction: column; gap: 18px\">\n<h2 style=\"margin: 0; font-size: clamp(40px, 5vw, 64px); line-height: 1\">say hi<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6\">Questions, collabs, or a talk for your team. I would love to hear from you.<\u002Fp>\n<a href=\"mailto:pavlikkeddy@gmail.com\" style=\"font-weight: 700; font-size: 20px\">pavlikkeddy@gmail.com<\u002Fa>\n<div style=\"display: flex; gap: 12px\">\n<a href=\"https://www.instagram.com/thetreatlife/\" aria-label=\"The Treat Life on Instagram\" style=\"width: 52px; height: 52px; border-radius: 999px; background: #2EC4C0; display: flex; align-items: center; justify-content: center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2A1033\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"17.5\" cy=\"6.5\" r=\"0.6\"><\u002Fcircle><\u002Fsvg><\u002Fa>\n<a href=\"https://www.linkedin.com/in/pavlikkeddy/\" aria-label=\"Keddy on LinkedIn\" style=\"width: 52px; height: 52px; border-radius: 999px; background: #2EC4C0; display: flex; align-items: center; justify-content: center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2A1033\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"4\"><\u002Frect><path d=\"M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<a href=\"https://github.com/kedarinapavlikova\" aria-label=\"Keddy on GitHub\" style=\"width: 52px; height: 52px; border-radius: 999px; background: #2EC4C0; display: flex; align-items: center; justify-content: center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2A1033\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 19c-4 1.5-4-2-6-2.5M15 21v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1-.3-3.4 1.3a11.6 11.6 0 0 0-6.2 0C6.6 2.8 5.6 3.1 5.6 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4.2 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 999 1 460px; min-width: 0; background: #FFFFFF; border-radius: 32px; padding: 32px\">\n<sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n<form name=\"contact\" method=\"POST\" action=\"https://api.web3forms.com/submit\" sc-camel-on-submit=\"{{ send }}\" style=\"display: flex; flex-direction: column; gap: 18px\">\n<input type=\"hidden\" name=\"access_key\" value=\"7a34b06b-ebd6-4509-a346-9d36df57480d\">\n<input type=\"hidden\" name=\"subject\" value=\"New note from the jamjar projects site\">\n<input type=\"hidden\" name=\"from_name\" value=\"jamjar projects site\">\n<input type=\"checkbox\" name=\"botcheck\" tabindex=\"-1\" aria-hidden=\"true\" style=\"display: none\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"a-name\" style=\"font-weight: 700\">Your name<\u002Flabel><input id=\"a-name\" name=\"name\" autocomplete=\"name\" required=\"\" style=\"font: inherit; font-size: 16px; padding: 14px; border: 2px solid #F56B9C; border-radius: 14px\"><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"a-email\" style=\"font-weight: 700\">Email<\u002Flabel><input id=\"a-email\" name=\"email\" type=\"email\" autocomplete=\"email\" required=\"\" style=\"font: inherit; font-size: 16px; padding: 14px; border: 2px solid #F56B9C; border-radius: 14px\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"a-topic\" style=\"font-weight: 700\">What's it about?<\u002Flabel><sc-raw-select id=\"a-topic\" name=\"topic\" style=\"font: inherit; font-size: 16px; padding: 14px; border: 2px solid #F56B9C; border-radius: 14px; background: #FFFFFF\"><option>Help bringing my idea to life<\u002Foption><option>A talk or workshop<\u002Foption><option>JAM Method training or classes<\u002Foption><option>GiveItAway<\u002Foption><option>PathWords or ReadCards<\u002Foption><option>Claude skills<\u002Foption><option>The Treat Life<\u002Foption><option>Something else<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"a-msg\" style=\"font-weight: 700\">Message<\u002Flabel><textarea id=\"a-msg\" name=\"message\" rows=\"5\" required=\"\" style=\"font: inherit; font-size: 16px; padding: 14px; border: 2px solid #F56B9C; border-radius: 14px; resize: vertical\"><\u002Ftextarea><\u002Fdiv>\n<button type=\"submit\" style=\"align-self: flex-start; font: inherit; font-weight: 700; font-size: 17px; padding: 16px 28px; background: #FFE680; color: #2A1033; border: 0; border-radius: 999px; cursor: pointer\">send it<\u002Fbutton>\n<\u002Fform>\n<sc-if value=\"{{ failed }}\" hint-placeholder-val=\"{{ false }}\">\n<p role=\"alert\" style=\"margin: 16px 0 0; font-size: 16px; font-weight: 600\">Oops, that didn't send. Email me at <a href=\"mailto:pavlikkeddy@gmail.com\">pavlikkeddy@gmail.com<\u002Fa> instead.<\u002Fp>\n<\u002Fsc-if>\n<\u002Fsc-if>\n<sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"display: flex; flex-direction: column; gap: 10px; padding: 24px 0\">\n<p class=\"fr\" style=\"margin: 0; font-size: 40px\">got it. thank you!<\u002Fp>\n<p style=\"margin: 0; font-size: 18px\">Your note is in. I'll write back soon.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n\n<!-- FOOTER on butter -->\n<footer style=\"background: #FFE680\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 48px 24px 36px; display: flex; flex-direction: column; gap: 24px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px; align-items: flex-end\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\"><span class=\"fr\" style=\"font-size: 44px; line-height: 1\">jamjar projects<\u002Fspan><span class=\"it\" style=\"font-size: 18px\">creating for real life with joy and movement.<\u002Fspan><\u002Fdiv>\n<nav aria-label=\"Footer\" style=\"display: flex; flex-wrap: wrap; gap: 8px 24px; font-weight: 600\">\n<a href=\"#projects\" style=\"padding: 8px 0\">projects<\u002Fa>\n<a href=\"#about\" style=\"padding: 8px 0\">about<\u002Fa>\n<a href=\"#work\" style=\"padding: 8px 0\">work with me<\u002Fa>\n<a href=\"#contact\" style=\"padding: 8px 0\">contact<\u002Fa>\n<a href=\"#privacy\" style=\"padding: 8px 0\">privacy<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.6\">Made in Kelowna, BC, on the unceded territory of the syilx / Okanagan people. © 2026 jamjar projects.<\u002Fp>\n<details id=\"privacy\" style=\"background: #FFFFFF; border-radius: 24px; padding: 20px 24px\">\n<summary style=\"cursor: pointer; font-weight: 700; font-size: 17px; padding: 6px 0\">privacy policy<\u002Fsummary>\n<div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 12px; font-size: 15px; line-height: 1.6; max-width: 760px\">\n<p style=\"margin: 0\"><strong>Short version:<\u002Fstrong> I only collect what you send me, I use it to write back, and I never sell it. Updated November 2026.<\u002Fp>\n<p style=\"margin: 0\"><strong>What I collect.<\u002Fstrong> When you use the contact form, I get your name, email, topic, and message. That's it. This site has no ads and no tracking pixels.<\u002Fp>\n<p style=\"margin: 0\"><strong>Why.<\u002Fstrong> To answer your note, and nothing else. I won't add you to a mailing list.<\u002Fp>\n<p style=\"margin: 0\"><strong>Where it lives.<\u002Fstrong> Form messages pass through Web3Forms, which emails them to my Gmail inbox. This site is hosted on Netlify. Fonts load from Google Fonts, which can see your IP address. Talk videos play from YouTube in privacy-enhanced mode; YouTube may set cookies once you press play.<\u002Fp>\n<p style=\"margin: 0\"><strong>How long.<\u002Fstrong> I delete form messages once we're done chatting, and within 12 months at the latest.<\u002Fp>\n<p style=\"margin: 0\"><strong>Other sites.<\u002Fstrong> Links to Instagram, LinkedIn, GitHub, YouTube, GiveItAway, PathWords, ReadCards, and JAM Method follow their own privacy policies.<\u002Fp>\n<p style=\"margin: 0\"><strong>Your rights.<\u002Fstrong> Want to see, fix, or delete what I have? Email <a href=\"mailto:pavlikkeddy@gmail.com\">pavlikkeddy@gmail.com<\u002Fa> and I'll sort it out. This policy follows BC's Personal Information Protection Act (PIPA).<\u002Fp>\n<\u002Fdiv>\n<\u002Fdetails>\n<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;heroTitle&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C93670&quot;,&quot;options&quot;:[&quot;#C93670&quot;,&quot;#F56B9C&quot;,&quot;#2A1033&quot;],&quot;section&quot;:&quot;Hero&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:4200}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const sent = !!(this.state && this.state.sent);\n    const failed = !!(this.state && this.state.failed);\n    return {\n      heroTitle: this.props.heroTitle ?? '#C93670',\n      sent: sent,\n      notSent: !sent,\n      failed: failed,\n      send: (e) => {\n        if (e && e.preventDefault) e.preventDefault();\n        const form = e && e.target;\n        const body = form ? new FormData(form) : new FormData();\n        // Sends to Web3Forms, which emails the note to Keddy.\n        fetch('https://api.web3forms.com/submit', { method: 'POST', headers: { Accept: 'application/json' }, body: body })\n          .then((r) => r.json())\n          .then((d) => { if (!d || !d.success) throw new Error('send failed'); this.setState({ sent: true, failed: false }); })\n          .catch(() => this.setState({ failed: true }));\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
